services:
  - type: web
    name: reconstruct-ai-backend
    runtime: python
    repo: https://github.com/Dhruvplaz-web/reconstruct-ai
    branch: main
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: reconstruct-ai-frontend
    runtime: node
    repo: https://github.com/Dhruvplaz-web/reconstruct-ai
    branch: main
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: reconstruct-ai-backend
          property: host

